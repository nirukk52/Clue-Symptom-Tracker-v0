# Rasa Pro CALM Domain for Clue Symptom Tracker
#
# Why this exists: Defines controlled slots for dialogue state tracking.
# All slots use "controlled" mapping — Next.js sets them via API, not Rasa NLU/LLM.
#
# Architecture:
# - OpenMed extracts biomedical entities (symptoms, meds, conditions)
# - LLM extracts factors (sleep, stress, energy, mood)
# - Next.js sets slots via POST /conversations/{id}/tracker/events
# - Rasa just tracks state — no NLU, no LLM, no response generation

version: "3.1"

slots:
  # Current symptom being discussed
  current_symptom:
    type: text
    mappings:
      - type: controlled

  # Severity of the current symptom (1-10)
  symptom_severity:
    type: float
    mappings:
      - type: controlled

  # Sleep quality/hours from last night (0-24)
  sleep_quality:
    type: float
    mappings:
      - type: controlled

  # Current stress level (1-10)
  stress_level:
    type: float
    mappings:
      - type: controlled

  # Current energy level (1-10)
  energy_level:
    type: float
    mappings:
      - type: controlled

  # Current mood rating (1-10)
  mood_rating:
    type: float
    mappings:
      - type: controlled

  # Current medication being discussed
  current_medication:
    type: text
    mappings:
      - type: controlled

  # Current condition being discussed
  current_condition:
    type: text
    mappings:
      - type: controlled

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false
