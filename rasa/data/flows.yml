# Rasa Pro CALM Flows for Clue Symptom Tracker
#
# Why this exists: Minimal flows to satisfy CALM training requirement.
# All slots are "controlled" — they're set via API, not by flow logic.
# These flows exist only to define the slot structure for Rasa's model.

flows:
  symptom_tracking:
    description: Track current symptom and severity
    steps:
      - id: "track_symptom"
        set_slots:
          - current_symptom: null
          - symptom_severity: null

  daily_checkin:
    description: Track daily health factors
    steps:
      - id: "track_factors"
        set_slots:
          - sleep_quality: null
          - stress_level: null
          - energy_level: null
          - mood_rating: null

  medication_tracking:
    description: Track medications
    steps:
      - id: "track_medication"
        set_slots:
          - current_medication: null

  condition_tracking:
    description: Track conditions
    steps:
      - id: "track_condition"
        set_slots:
          - current_condition: null
