# Rasa Stories (Conversation Patterns)
#
# Why this exists: Defines conversation flows for training the dialogue model.
# We keep these minimal — the LLM handles complex conversation logic.
# Stories just teach Rasa how to manage forms.
# RulePolicy handles all form activation/submission; stories only cover
# edge cases rules can't express.

version: "3.1"

stories:
  # ==========================================================================
  # PROVIDE VALUE: User gives a number mid-form
  # Only story needed — form activation/submission handled by rules.
  # ==========================================================================
  - story: provide value in symptom form
    steps:
      - action: symptom_detail_form
      - active_loop: symptom_detail_form
      - intent: provide_value
      - action: symptom_detail_form
      - active_loop: symptom_detail_form

  - story: provide value in checkin form
    steps:
      - action: daily_checkin_form
      - active_loop: daily_checkin_form
      - intent: provide_value
      - action: daily_checkin_form
      - active_loop: daily_checkin_form
