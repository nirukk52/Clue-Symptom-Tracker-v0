# Rasa Pro CALM Config for Clue Symptom Tracker
#
# Why this exists: Minimal CALM config for slot tracking.
# Next.js handles all NLU (OpenMed + LLM) and response generation.
# Rasa tracks controlled slots set via API.

recipe: default.v1
assistant_id: clue-symptom-tracker
language: en

# Minimal pipeline — just tokenization for flows to work
pipeline:
  - name: WhitespaceTokenizer

# CALM requires FlowPolicy for flows
policies:
  - name: FlowPolicy
