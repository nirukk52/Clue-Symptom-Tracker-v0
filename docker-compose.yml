# Docker Compose for Clue OSS Stack
#
# Why this exists: Runs OpenMed (biomedical NER) + Redis (Rasa state persistence)
# as local Docker services for development.
#
# NOTE: Rasa Pro runs natively in Python venv (see rasa/README.md) — Docker images
# crash on Apple Silicon due to CPU instruction incompatibility.
#
# Usage:
#   docker-compose up -d          # Start OpenMed + Redis
#   docker-compose logs -f openmed # Tail OpenMed logs
#   docker-compose down           # Stop all services
#
# Services:
#   - openmed:8080 → Biomedical entity extraction (symptoms, meds, conditions)
#   - redis:6380 (host) → Rasa tracker store (conversation state persistence)

services:
  # OpenMed: Pretrained biomedical NER models
  # Docs: https://github.com/maziyarpanahi/openmed
  openmed:
    build:
      context: ./openmed
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    volumes:
      # Cache HuggingFace models between restarts
      - openmed_cache:/root/.cache/huggingface
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s  # Models download on first use (~434MB)
    restart: unless-stopped

  # Redis: Tracker store for Rasa Pro conversation state
  # Persists dialogue state (slots) across server restarts
  redis:
    image: redis:7-alpine
    ports:
      # Host 6380 avoids conflict when another Redis already uses 6379
      - '6380:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  openmed_cache:
    driver: local
